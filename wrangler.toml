# Deployment configuration: the source of truth for what runs on Cloudflare.
# worker/wrangler.toml (local `wrangler dev` / `wrangler types`) must match this
# file except for main/assets paths and the workers_dev/preview_urls keys below.
# worker/wrangler.example.toml must match worker/wrangler.toml exactly.
# `npm run check:wrangler-configs` enforces this; update all three together.
name = "cf-vps-monitor"
main = "worker/src/index.ts"
compatibility_date = "2026-06-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true
head_sampling_rate = 1

[placement]
mode = "smart"

[triggers]
crons = ["*/2 * * * *"]

[[durable_objects.bindings]]
name = "LIVE_DATA"
class_name = "LiveDataDO"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveDataDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimitDO"]

[vars]
SUPABASE_URL = "https://PROJECT_REF.supabase.co"
CF_MONITOR_REPOSITORY = "kadidalax/cf-vps-monitor"

[assets]
directory = "frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ping", "/agent/*"]
